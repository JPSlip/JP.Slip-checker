<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP เช็คสลิปการโอนเงิน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4 shadow-sm border-0 rounded-4">
          <h3 class="text-center mb-3">💳 JP เช็คสลิปการโอนเงิน</h3>
          <p class="text-muted text-center small">สแกน QR Code และอ่านข้อความจากสลิป (OCR)</p>
          <div class="mb-3">
            <label for="slipInput" class="form-label fw-bold">เลือกรูปภาพสลิป:</label>
            <input type="file" id="slipInput" accept="image/*" class="form-control">
          </div>
          <div class="text-center my-3 d-none" id="previewBox">
            <img id="imagePreview" alt="ตัวอย่างสลิป" class="img-fluid rounded border" style="max-height:300px">
          </div>
          <button id="btnProcess" class="btn btn-primary w-100" disabled>🔍 ประมวลผลสลิป</button>
          <div class="progress mt-3 d-none" id="progressWrap" role="progressbar" aria-label="ความคืบหน้า">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%">0%</div>
          </div>
          <div class="mt-4 d-none" id="resultBox">
            <div class="alert alert-info">
              <h6>📌 ข้อมูล QR Code:</h6>
              <code id="qrResult" class="text-wrap d-block mb-3"></code>
              <h6>📝 ข้อความจากภาพ (OCR):</h6>
              <pre id="ocrResult" class="small bg-white p-2 border rounded text-wrap" style="max-height:250px;overflow-y:auto;white-space:pre-wrap"></pre>
            </div>
          </div>
          <p class="small text-secondary mb-0">หมายเหตุ: ผล OCR หรือ QR เป็นเพียงการอ่านข้อความจากภาพ ไม่ใช่การยืนยันว่าเงินเข้าบัญชีจริง</p>
        </div>
      </div>
    </div>
  </main>
<script>
const slipInput = document.getElementById('slipInput');
const imagePreview = document.getElementById('imagePreview');
const previewBox = document.getElementById('previewBox');
const btnProcess = document.getElementById('btnProcess');
const resultBox = document.getElementById('resultBox');
const qrResult = document.getElementById('qrResult');
const ocrResult = document.getElementById('ocrResult');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');

let loadedImage = null;
let currentUrl = null;

slipInput.addEventListener('change', (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) {
    btnProcess.disabled = true;
    return;
  }
  if (!file.type.startsWith('image/')) {
    alert('กรุณาเลือกไฟล์รูปภาพ');
    slipInput.value = '';
    return;
  }
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(file);
  loadedImage = new Image();
  loadedImage.onload = () => {
    imagePreview.src = currentUrl;
    previewBox.classList.remove('d-none');
    btnProcess.disabled = false;
    resultBox.classList.add('d-none');
  };
  loadedImage.onerror = () => {
    alert('ไม่สามารถเปิดรูปภาพนี้ได้');
    btnProcess.disabled = true;
  };
  loadedImage.src = currentUrl;
});

btnProcess.addEventListener('click', async () => {
  if (!loadedImage || !loadedImage.complete || !loadedImage.naturalWidth) {
    alert('กรุณาเลือกรูปภาพก่อน');
    return;
  }

  btnProcess.disabled = true;
  btnProcess.textContent = '⏳ กำลังประมวลผล...';
  resultBox.classList.add('d-none');
  progressWrap.classList.remove('d-none');
  progressBar.style.width = '0%';
  progressBar.textContent = '0%';
  qrResult.textContent = '';
  ocrResult.textContent = '';

  try {
    // QR scan: scale large images down for smoother browser performance.
    const maxSide = 1800;
    const scale = Math.min(1, maxSide / Math.max(loadedImage.naturalWidth, loadedImage.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(loadedImage.naturalWidth * scale);
    canvas.height = Math.round(loadedImage.naturalHeight * scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
    qrResult.textContent = qr ? qr.data : 'ไม่พบ QR Code ในภาพสลิป';

    // OCR progress
    const worker = await Tesseract.createWorker('tha+eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text' && typeof m.progress === 'number') {
          const pct = Math.round(m.progress * 100);
          progressBar.style.width = pct + '%';
          progressBar.textContent = pct + '%';
        }
      }
    });
    try {
      const result = await worker.recognize(imagePreview);
      ocrResult.textContent = result.data.text || 'ไม่พบข้อความในภาพ';
    } finally {
      await worker.terminate();
    }
  } catch (error) {
    console.error(error);
    ocrResult.textContent = 'เกิดข้อผิดพลาดในการประมวลผล: ' + (error.message || error);
  } finally {
    resultBox.classList.remove('d-none');
    progressWrap.classList.add('d-none');
    btnProcess.disabled = false;
    btnProcess.textContent = '🔍 ประมวลผลสลิป';
  }
});
</script>
</body>
</html>
